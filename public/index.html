<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battle d'anecdotes — INSIDE CIRCLE</title>
<meta name="description" content="Votez pour votre anecdote préférée. Le Top 3 est révélé en direct.">
<meta name="theme-color" content="#0A1350">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@600;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ic-ring" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#4A21D0"></stop>
          <stop offset="45%" stop-color="#1E6FE0"></stop>
          <stop offset="100%" stop-color="#2FD8E8"></stop>
        </linearGradient>
      </defs>
      <path d="M 11.33 39.52 A 22 22 0 1 0 11.33 24.48" fill="none"
            stroke="url(#ic-ring)" stroke-width="13" stroke-linecap="butt"></path>
    </svg>
    <span class="wordmark">Inside<br>Circle</span>
  </div>
  <div class="live"><span class="dot" id="dot"></span><span id="liveLabel">Connexion…</span></div>
</header>

<main class="page">

  <section class="hero">
    <h1 id="title">Battle d'anecdotes</h1>
    <p class="tagline" id="subtitle">INSIDE CIRCLE — Événement de lancement</p>
  </section>

  <nav class="rail" aria-label="Déroulé">
    <div class="stepx" data-step="lobby"><b>01</b><span>Salle d'attente</span></div>
    <div class="stepx" data-step="vote"><b>02</b><span>Vote</span></div>
    <div class="stepx" data-step="results"><b>03</b><span>Top 3</span></div>
  </nav>

  <section class="stage" id="stage" aria-live="polite">
    <div class="stage-hd">
      <h2 id="stageTitle">Chargement</h2>
      <span class="meter" id="stageMeter"></span>
    </div>
    <div class="stage-bd" id="stageBody">
      <p class="muted">Connexion à la session…</p>
    </div>
  </section>

  <section class="regie" id="regie" hidden>
    <div class="stage-hd">
      <h2>Régie</h2>
      <span class="meter">Animateur</span>
    </div>
    <div class="stage-bd">
      <div class="group">
        <h3>Phase en cours</h3>
        <div class="row">
          <button class="btn ghost" data-phase="lobby">1 · Salle d'attente</button>
          <button class="btn ghost" data-phase="vote">2 · Ouvrir le vote</button>
          <button class="btn ghost" data-phase="results">3 · Révéler le Top 3</button>
        </div>
      </div>

      <div class="group">
        <h3>Les anecdotes</h3>
        <label class="lbl" for="bulk">Une anecdote par ligne — suffixe <span class="nocaps">« | Prénom »</span> pour l'attribuer</label>
        <textarea id="bulk" spellcheck="true" rows="8" placeholder="La réunion de crise qui s'est terminée en fou rire | Camille
Le client qui est venu au rendez-vous avec sa mère | Yann"></textarea>
        <div class="row">
          <button class="btn" id="saveBulk">Enregistrer la liste</button>
          <span class="muted" id="bulkHint"></span>
        </div>
      </div>

      <div class="group">
        <h3>Décompte en direct</h3>
        <div id="peek" class="peek"><span class="muted">—</span></div>
      </div>

      <div class="group">
        <h3>Habillage</h3>
        <label class="lbl" for="titleInput">Titre</label>
        <input type="text" id="titleInput" maxlength="70">
        <label class="lbl" for="subtitleInput">Sous-titre</label>
        <input type="text" id="subtitleInput" maxlength="90">
      </div>

      <div class="group">
        <h3>Remise à zéro</h3>
        <div class="row">
          <button class="btn ghost" id="resetVotes">Effacer les votes</button>
          <button class="btn ghost danger" id="resetAll">Tout effacer</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="foot">
    <button class="linkbtn" id="projectBtn">Projeter le QR code</button>
    <button class="linkbtn" id="regieBtn">Accès régie</button>
    <span class="muted" id="footNote"></span>
  </footer>
</main>

<div class="project" id="project" hidden>
  <button class="btn ghost close" id="closeProject">Fermer</button>
  <div class="project-in" id="projectBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>

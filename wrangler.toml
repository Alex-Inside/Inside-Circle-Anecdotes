name = "inside-circle-anecdotes"
main = "src/index.js"
compatibility_date = "2026-01-01"

# La page publique (HTML/CSS/JS) est servie directement par le Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Tout l'état de la session vit dans un seul Durable Object.
[[durable_objects.bindings]]
name = "POLL"
class_name = "Poll"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Poll"]

[vars]
# Change ce nom pour repartir d'une session vierge sans rien effacer de l'ancienne
# (utile pour un second événement : "lancement-2026", "session-2", ...).
SESSION_NAME = "lancement-2026"

# Le code de la régie n'est PAS ici : c'est un secret.
#   npx wrangler secret put ADMIN_TOKEN
#   (ou, dans le tableau de bord : Settings > Variables and Secrets > Add > Secret)

# Les anecdotes de l'événement, pré-chargées au tout premier démarrage.
# Anonymes : aucun auteur n'est associé, ni sur les téléphones ni à la projection.
# La pré-charge n'a lieu qu'une fois ; ensuite, c'est la régie qui fait foi.
SEED_ANECDOTES = '''
Je suis apiculteur amateur.
Je me suis mis au parachutisme.
J'ai couru 4 marathons.
J'ai auto-produit et distribué 2 albums et 1 clip de musique.
Il m'aura fallu parcourir 5 000 km pour rencontrer quelqu'un qui vit littéralement dans la même rue que moi : le monde est plus petit qu'on ne croit.
